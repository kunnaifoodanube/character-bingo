<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>หน้าจอพิธีกร — Character Bingo</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="host">
    <div class="stage">
      <div class="topbar">
        <h1>Character Bingo</h1>
        <span class="status-pill" id="roundPill">รอบที่ 1</span>
        <span class="grow"></span>
        <button class="btn secondary" id="btnVerify">ตรวจบัตร</button>
        <button class="btn secondary" id="btnQR">QR เข้าเกม</button>
        <button class="btn ghost" id="btnFull" title="เต็มจอ">⛶</button>
      </div>

      <div class="big-reveal" id="reveal">
        <div class="count" id="count">0 / 24</div>
        <div class="count" id="patternLabel" style="left:auto;right:22px;color:var(--primary)"></div>
        <div class="placeholder" id="placeholder">กด “สุ่มตัวถัดไป” เพื่อเริ่ม</div>
        <img id="bigImg" class="hidden" alt="">
        <div class="name" id="bigName"></div>
      </div>

      <div class="controls">
        <button class="btn big" id="btnDraw">🎲 สุ่มตัวถัดไป</button>
        <span class="muted small">ปุ่มลัด: Space / → / PageDown (รีโมตพรีเซนต์)</span>
        <span class="grow"></span>
        <button class="btn ghost" id="btnUndo">↶ ยกเลิกตัวล่าสุด</button>
        <button class="btn danger" id="btnNewRound">เริ่มรอบใหม่</button>
      </div>
    </div>

    <aside class="side">
      <div class="panel">
        <label class="field" style="margin:0 0 .5rem"><span class="small">ชุดภาพ</span>
          <select class="input" id="themeSel" style="padding:.45rem .7rem;font-size:.95rem" aria-label="เลือกชุดภาพ"></select></label>
        <label class="field" style="margin:0"><span class="small">รางวัลที่กำลังเล่น</span>
          <select class="input" id="patternSel" style="padding:.45rem .7rem;font-size:.95rem" aria-label="รูปแบบรางวัล">
            <option value="line1">ครบ 1 แนว</option><option value="line2">ครบ 2 แนว</option><option value="full">เต็มบัตร 16 ช่อง</option>
          </select></label>
      </div>
      <div class="panel">
        <div class="row"><h3 class="grow" style="margin:0">ตัวละครทั้งหมด</h3><span class="muted small" id="fp"></span></div>
        <div class="board" id="board" style="margin-top:.6rem"></div>
      </div>
      <div class="panel" style="flex:1;min-height:120px;overflow:auto">
        <h3>ประวัติการสุ่มรอบนี้</h3>
        <div class="history" id="history"><span class="muted small">ยังไม่มี</span></div>
      </div>
      <div class="panel">
        <h3>เมนูอื่น ๆ</h3>
        <div class="row">
          <button class="btn ghost" id="btnRounds">ประวัติทุกรอบ</button>
          <a class="btn ghost" id="lnkPrint" href="print.html" target="_blank">พิมพ์บัตรสำรอง</a>
          <a class="btn ghost" href="admin.html" target="_blank">จัดการภาพ</a>
        </div>
        <p class="small muted" id="hostNote" style="margin-bottom:0">สถานะการสุ่มบันทึกในเครื่องนี้ รีเฟรชได้ไม่หาย · ควรเปิดหน้านี้แท็บเดียว</p>
      </div>
    </aside>
  </div>
  <div id="qrFull" class="qr-full hidden">
    <div class="t">สแกนเพื่อรับบัตรบิงโก</div>
    <div id="qrBig"></div>
    <div class="mono muted" id="qrUrl" style="word-break:break-all;text-align:center"></div>
    <button class="btn" id="btnQRClose">ปิด</button>
  </div>
  <div id="modalRoot"></div>
  <script src="assets/vendor/qrcode.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/themes-local.js"></script>
  <script src="assets/js/host.js"></script>
</body>
</html>
