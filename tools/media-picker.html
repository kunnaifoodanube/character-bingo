<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Media picker (Wikimedia Commons)</title>
<style>
  body { font: 13px/1.35 system-ui, sans-serif; margin: 10px; background: #fff; }
  h2 { margin: 14px 0 6px; font-size: 16px; background: #eee; padding: 4px 8px; }
  .g { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .c { border: 1px solid #ccc; padding: 3px; }
  .c img { width: 100%; height: 120px; object-fit: contain; background: #f4f4f4; display: block; }
  .t { font-size: 11px; word-break: break-all; }
  .l { font-weight: 700; color: #060; } .l.bad { color: #b00; }
  .n { font-size: 10px; color: #444; }
  pre { white-space: pre-wrap; font-size: 11px; }
</style>
</head>
<body>
<div id="out">loading…</div>
<script>
/* tools/media-picker.html?q=term1;term2&type=video&n=12   — search
   tools/media-picker.html?titles=File:A.jpg|File:B.webm       — exact metadata (JSON) */
const P = new URLSearchParams(location.search);
const API = 'https://commons.wikimedia.org/w/api.php?origin=*&format=json&formatversion=2&';
const strip = h => (h || '').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const FREE = /^(CC0|CC BY|CC BY-SA|Public domain|PD|No restrictions|FAL|GFDL|Attribution)/i;
async function search(q, type, n) {
  const s = q + (type === 'video' ? ' filetype:video' : type === 'image' ? ' filetype:bitmap' : '');
  const u = API + 'action=query&generator=search&gsrnamespace=6&gsrlimit=' + n + '&gsrsearch=' + encodeURIComponent(s) +
    '&prop=imageinfo&iiprop=url|mime|size|extmetadata&iiurlwidth=320&iiextmetadatafilter=LicenseShortName|Artist';
  const j = await (await fetch(u)).json();
  const pages = (j.query && j.query.pages || []).sort((a, b) => a.index - b.index);
  return '<h2>' + esc(q) + (type ? ' [' + type + ']' : '') + '</h2><div class="g">' + pages.map((p, i) => {
    const ii = p.imageinfo && p.imageinfo[0] || {}, m = ii.extmetadata || {};
    const lic = m.LicenseShortName ? m.LicenseShortName.value : '?';
    return '<div class="c"><img src="' + esc(ii.thumburl || '') + '"><div class="t"><b>#' + (i + 1) + '</b> ' + esc(p.title.replace(/^File:/, '')) +
      '</div><div class="l ' + (FREE.test(lic) ? '' : 'bad') + '">' + esc(lic) + '</div><div class="n">' + esc(strip(m.Artist && m.Artist.value).slice(0, 60)) +
      ' · ' + esc(ii.mime || '') + (ii.duration ? ' · ' + Math.round(ii.duration) + 's' : '') + ' · ' + (ii.width || '') + '×' + (ii.height || '') + '</div></div>';
  }).join('') + '</div>';
}
async function meta(titles) {
  const u = API + 'action=query&titles=' + encodeURIComponent(titles) +
    '&prop=videoinfo&viprop=url|mime|size|extmetadata|derivatives&viurlwidth=' + (P.get('w') || 800) +
    '&viextmetadatafilter=LicenseShortName|LicenseUrl|Artist|ObjectName|UsageTerms|Copyrighted|DateTimeOriginal|Credit';
  const j = await (await fetch(u)).json();
  const norm = {}; (j.query.normalized || []).forEach(n => norm[n.to] = n.from);
  const rows = (j.query.pages || []).map(p => {
    const ii = p.videoinfo && p.videoinfo[0] || {}, m = ii.extmetadata || {};
    const v = k => m[k] ? strip(m[k].value) : '';
    const der = (ii.derivatives || []).filter(d => /webm|mp4/.test(d.type)).map(d => ({ t: d.transcodekey || d.type, w: d.width, h: d.height, src: d.src }));
    return { title: p.title, asked: norm[p.title] || p.title, missing: !!p.missing, page: ii.descriptionurl, url: ii.url, thumb: ii.thumburl, mime: ii.mime,
      w: ii.width, h: ii.height, dur: ii.duration ? Math.round(ii.duration) : undefined,
      license: v('LicenseShortName'), licenseUrl: v('LicenseUrl'), artist: v('Artist'), credit: v('Credit').slice(0, 160), object: v('ObjectName'), date: v('DateTimeOriginal'), der };
  });
  window.ROWS = rows;
  return '<div class="g" style="grid-template-columns:repeat(4,1fr)">' + rows.map((r, i) => '<div class="c"><img style="height:230px" src="' + esc(r.thumb || '') + '"><div class="t"><b>' + (i + 1) + '</b> ' + esc(r.title) + (r.missing ? ' <b style=color:red>MISSING</b>' : '') +
    '</div><div class="l">' + esc(r.license) + '</div><div class="n">' + esc(r.artist.slice(0, 80)) + ' · ' + esc(r.mime || '') + ' ' + (r.w || '') + '×' + (r.h || '') + (r.dur ? ' · ' + r.dur + 's' : '') + '</div></div>').join('') + '</div>' +
    '<pre id="json">' + esc(JSON.stringify(rows)) + '</pre>';
}
(async () => {
  const out = document.getElementById('out');
  try {
    if (P.get('titles')) { out.innerHTML = await meta(P.get('titles')); return; }
    const qs = (P.get('q') || '').split(';').filter(Boolean), type = P.get('type') || '', n = +(P.get('n') || 12);
    const parts = await Promise.all(qs.map(q => search(q, type, n)));
    out.innerHTML = parts.join('');
  } catch (e) { out.textContent = 'ERROR ' + e; }
})();
</script>
</body>
</html>
