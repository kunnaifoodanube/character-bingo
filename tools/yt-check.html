<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>YouTube embed check</title>
<style>
  body { font: 13px/1.35 system-ui, sans-serif; margin: 10px; }
  table { border-collapse: collapse; width: 100%; }
  td, th { border: 1px solid #ccc; padding: 3px 6px; vertical-align: top; }
  .ok { background: #e3f7ea; } .bad { background: #ffe3e3; }
  #stage { position: fixed; right: 4px; bottom: 4px; width: 320px; height: 180px; }
</style>
</head>
<body>
<h3 id="sum">checking…</h3>
<table><thead><tr><th>#</th><th>term</th><th>id</th><th>channel</th><th>title</th><th>sec</th><th>result</th></tr></thead><tbody id="rows"></tbody></table>
<pre id="json"></pre>
<div id="stage"><div id="p"></div></div>
<script>
/* tools/yt-check.html?list=Action:ID1,ID2|Comedy:ID3 — ทดลองโหลดแต่ละคลิปด้วย YouTube IFrame Player ทีละคลิป
   รายงานชื่อช่อง ชื่อคลิป ความยาว และว่าเจ้าของอนุญาตให้ฝังหรือไม่ (error 101/150 = ไม่อนุญาต) */
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const items = [];
(new URLSearchParams(location.search).get('list') || '').split('|').filter(Boolean).forEach(part => {
  const [term, ids] = part.split(':'); (ids || '').split(',').filter(Boolean).forEach(id => items.push({ term, id }));
});
const rows = document.getElementById('rows'), out = [];
items.forEach((it, i) => rows.insertAdjacentHTML('beforeend', '<tr id="r' + i + '"><td>' + (i + 1) + '</td><td>' + esc(it.term) + '</td><td>' + esc(it.id) + '</td><td></td><td></td><td></td><td>…</td></tr>'));
let player, idx = -1, timer;
function setRow(i, r) {
  const tr = document.getElementById('r' + i); tr.className = r.ok ? 'ok' : 'bad';
  tr.children[3].textContent = r.author || ''; tr.children[4].textContent = r.title || ''; tr.children[5].textContent = r.dur || '';
  tr.children[6].textContent = r.ok ? 'embed OK' : ('ERROR ' + r.err);
  out[i] = Object.assign({ term: items[i].term, id: items[i].id }, r);
  document.getElementById('json').textContent = JSON.stringify(out.filter(Boolean));
  const n = out.filter(Boolean).length, ok = out.filter(x => x && x.ok).length;
  document.getElementById('sum').textContent = 'ตรวจแล้ว ' + n + ' / ' + items.length + ' · ฝังได้ ' + ok;
}
function next() {
  clearTimeout(timer); idx++;
  if (idx >= items.length) { document.getElementById('sum').textContent += ' · เสร็จ'; return; }
  const id = items[idx].id, my = idx;
  timer = setTimeout(() => { if (!out[my]) { const d = player.getVideoData ? player.getVideoData() : {}; setRow(my, { ok: false, err: 'timeout', author: d.author, title: d.title }); next(); } }, 15000);
  player.loadVideoById(id);
}
function onState(e) {
  if (idx < 0 || out[idx]) return;
  if (e.data === 1) { // PLAYING
    const d = player.getVideoData(); const my = idx;
    setRow(my, { ok: true, author: d.author, title: d.title, dur: Math.round(player.getDuration()) });
    player.pauseVideo(); setTimeout(next, 300);
  }
}
function onErr(e) { if (idx < 0 || out[idx]) return; const d = player.getVideoData ? player.getVideoData() : {}; setRow(idx, { ok: false, err: e.data, author: d.author, title: d.title }); setTimeout(next, 300); }
window.onYouTubeIframeAPIReady = function () {
  player = new YT.Player('p', { width: 320, height: 180, playerVars: { autoplay: 1, mute: 1, playsinline: 1, rel: 0 },
    events: { onReady: () => { player.mute(); next(); }, onStateChange: onState, onError: onErr } });
};
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
