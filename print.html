<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>พิมพ์บัตรบิงโกสำรอง — Character Bingo</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css?v=1.5.2">
  <style>
    @page { size: A4 portrait; margin: 8mm; }
    .sheet { background: #fff; width: 194mm; margin: 0 auto 10mm; box-shadow: var(--shadow); }
    .page { width: 194mm; height: 279mm; display: grid; gap: 4mm; padding: 0; page-break-after: always; break-after: page; overflow: hidden; }
    .page:last-child { page-break-after: auto; break-after: auto; }
    .page.per2 { grid-template-rows: 1fr 1fr; }
    .page.per4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .pcard { border: 1.2mm solid #2b2140; border-radius: 5mm; padding: 4mm; display: flex; flex-direction: column; overflow: hidden; }
    .pcard .hd { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2.5mm; gap: 3mm; }
    .pcard .ttl { font-weight: 900; font-size: 16pt; line-height: 1.1; }
    .pcard .sub { font-size: 9pt; color: #555; }
    .pcard .no { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 900; font-size: 20pt; white-space: nowrap; }
    .pcard .nm-line { font-size: 10pt; margin-bottom: 2mm; }
    .pgrid { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 1.5mm; min-height: 0; }
    .pgrid div { border: .5mm solid #999; border-radius: 2.5mm; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1mm; min-height: 0; overflow: hidden; }
    .pgrid img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
    .pgrid span { font-size: 8.5pt; font-weight: 700; line-height: 1.1; text-align: center; }
    .per4 .pcard .ttl { font-size: 12pt; } .per4 .pcard .no { font-size: 15pt; } .per4 .pgrid span { font-size: 7pt; }
    .pcard .ft { font-size: 7.5pt; color: #666; margin-top: 1.5mm; display: flex; justify-content: space-between; }
    .slips { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(6, 1fr); gap: 0; }
    .slips div { border: .3mm dashed #888; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2mm; }
    .slips img { width: 26mm; height: 26mm; object-fit: contain; }
    .slips span { font-weight: 800; font-size: 11pt; text-align: center; }
    .slips div.txt span { font-size: 15pt; line-height: 1.15; } .slips small, .call small { font-weight: 500; font-size: .75em; }
    .pgrid.txt span { font-size: 12pt; line-height: 1.15; word-break: break-word; } .per4 .pgrid.txt span { font-size: 9pt; }
    .call { display: block; }
    .call table { width: 100%; border-collapse: collapse; font-size: 10.5pt; }
    .call td, .call th { border: .3mm solid #999; padding: 1.2mm 2mm; }
    .call img { width: 11mm; height: 11mm; object-fit: contain; vertical-align: middle; }
    @media print {
      body { background: #fff; }
      .noprint { display: none !important; }
      .sheet { box-shadow: none; margin: 0; width: auto; }
    }
  </style>
</head>
<body>
  <div class="wrap noprint">
    <div class="row" style="margin-bottom:1rem">
      <h1 class="grow" style="margin:0">พิมพ์บัตรบิงโกสำรอง</h1>
      <a class="btn ghost" href="host.html">หน้าจอพิธีกร</a>
    </div>
    <div class="panel">
      <div class="row" style="align-items:flex-end">
        <label class="field"><span>ชุดภาพ</span><select class="input" id="themeSel"></select></label>
        <label class="field"><span>บัตรเลขที่ เริ่ม</span><input class="input" id="from" type="number" min="1" max="9999" value="1" style="width:110px"></label>
        <label class="field"><span>ถึง</span><input class="input" id="to" type="number" min="1" max="9999" value="100" style="width:110px"></label>
        <label class="field"><span>ต่อหน้า A4</span><select class="input" id="per"><option value="2">2 ใบ (ใหญ่)</option><option value="4">4 ใบ (ประหยัด)</option></select></label>
        <label class="field grow"><span>หัวบัตร</span><input class="input" id="title" value="Character Bingo · Digital Media Open House" maxlength="60"></label>
      </div>
      <div class="row">
        <label class="row small"><input type="checkbox" id="incCall" checked> แนบแผ่นรายชื่อตัวละคร (ให้เจ้าหน้าที่ติ๊ก)</label>
        <label class="row small"><input type="checkbox" id="incSlips" checked> แนบสลิปตัวละครสำหรับจับฉลาก (กรณีโปรเจกเตอร์เสีย)</label>
      </div>
      <div class="row" style="margin-top:.6rem">
        <button class="btn" id="btnBuild">สร้างตัวอย่าง</button>
        <button class="btn big" id="btnPrint" disabled>🖨 พิมพ์ / บันทึกเป็น PDF</button>
      </div>
      <div id="report" style="margin-top:.8rem"></div>
      <p class="small muted">กดพิมพ์แล้วเลือกปลายทาง “Save as PDF / บันทึกเป็น PDF” เพื่อได้ไฟล์ PDF · ตั้งค่าขนาดกระดาษ A4, ระยะขอบ “ค่าเริ่มต้น”, เปิด “กราฟิกพื้นหลัง” · บัตรกระดาษใช้เลข 00001–09999 ไม่ชนกับบัตรมือถือ</p>
    </div>
  </div>
  <div class="sheet" id="out"></div>
  <div id="modalRoot"></div>
  <script src="assets/js/core.js?v=1.5.2"></script>
  <script src="assets/js/ui.js?v=1.5.2"></script>
  <script src="assets/js/themes-local.js?v=1.5.2"></script>
  <script src="assets/js/print.js?v=1.5.2"></script>
</body>
</html>
